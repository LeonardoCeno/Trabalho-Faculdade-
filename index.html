<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Livraria</title>
    <link rel="stylesheet" href="./src/login/login.css">
    <link rel="stylesheet" href="./src/css/acessibilidade.css">
</head>
<body>

    <a href="#conteudo" class="pular-conteudo">Pular para o formulário</a>

    <div class="login-page">

        <div class="login-visual">
            <div class="visual-content">
                <span class="eyebrow">AURISTICA LIVRARIA</span>
                <h1>Histórias para<br>ficar por perto.</h1>
                <p>
                    Encontre livros que combinam com você,
                    descubra novos mundos e monte sua próxima leitura.
                </p>
            </div>
        </div>

        <main class="login-area" id="conteudo">

            <div class="login-box">

                <div class="login-heading">
                    <span>ENTRAR</span>
                    <h2>Bem-vindo.</h2>
                    <p>Entre na sua conta para continuar.</p>
                </div>

                <form id="form-login" novalidate>

                    <div class="field">
                        <label for="usuario">Nome de usuário</label>
                        <input
                            type="text"
                            id="usuario"
                            placeholder="Digite seu nome"
                            autocomplete="username"
                            aria-describedby="usuario-erro"
                            required
                        >
                        <span class="erro" id="usuario-erro" aria-live="polite"></span>
                    </div>

                    <div class="field">
                        <label for="senha">Senha</label>
                        <div class="senha-wrapper">
                            <input
                                type="password"
                                id="senha"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                aria-describedby="senha-erro"
                                required
                            >
                            <button type="button" class="mostrar-senha" aria-controls="senha" aria-pressed="false">Mostrar</button>
                        </div>
                        <span class="erro" id="senha-erro" aria-live="polite"></span>
                    </div>

                    <button type="submit">Entrar</button>

                </form>

                <div class="login-footer">
                    Ainda não possui uma conta?
                    <a href="./src/login/register.html">Criar conta</a>
                </div>

            </div>

        </main>

    </div>

    <script src="./src/js/storage.js"></script>
    <script src="./src/js/login.js"></script>
    <script src="./src/js/acessibilidade.js"></script>

</body>
</html>
