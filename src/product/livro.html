<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Livro | Livraria</title>

    <link rel="stylesheet" href="./livro.css">
    <link rel="stylesheet" href="../css/acessibilidade.css">
</head>

<body>

    <a href="#conteudo" class="pular-conteudo">Pular para o conteúdo</a>

    <header class="header">

        <div class="header-content">

            <a href="../home/home.html">
                <img
                    class="logo"
                    src="../img/logoauristicatrue.png"
                    alt="Auristica Livraria — página inicial"
                >
            </a>

            <nav class="navigation" aria-label="Navegação principal">

                <a href="../home/home.html">
                    Início
                </a>

                <a href="../home/home.html#catalogo">
                    Catálogo
                </a>

                <a href="novo-livro.html">
                    Cadastrar livro
                </a>

            </nav>

            <form class="search" role="search" action="../home/home.html">
                <label for="busca" class="sr-only">Pesquisar livros</label>
                <input
                    type="search"
                    id="busca"
                    name="busca"
                    placeholder="Pesquisar livros..."
                >
            </form>

            <a href="carrinho.html" class="cart-link">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="20" r="1.5"></circle>
                    <circle cx="18" cy="20" r="1.5"></circle>
                    <path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.5L22 7H6"></path>
                </svg>
                <span class="sr-only">Carrinho com</span>
                <span class="cart-count" id="carrinho-contador">0</span>
                <span class="sr-only">item(ns)</span>
            </a>

            <div class="user-area">

                <div class="user">

                    <img
                        src="../img/Userbeta.png"
                        alt=""
                    >

                </div>

                <span id="username">
                    Olá, visitante
                </span>

                <button type="button" id="sair" class="logout" hidden>
                    Sair
                </button>

            </div>

        </div>

    </header>


    <main id="conteudo">

        <nav class="breadcrumb" aria-label="Você está em">

            <a href="../home/home.html">
                Início
            </a>

            <span aria-hidden="true">/</span>

            <span aria-current="page" id="breadcrumb-titulo">Livro</span>

        </nav>


        <section class="product" id="produto" aria-labelledby="livro-titulo">

            <div class="product-image">

                <div class="image-background" id="livro-capa"></div>

            </div>


            <div class="product-info">

                <span class="category" id="livro-categoria"></span>

                <h1 id="livro-titulo">
                    Carregando...
                </h1>

                <p class="author" id="livro-autor"></p>

                <div class="line" aria-hidden="true"></div>

                <p class="description" id="livro-descricao"></p>

                <dl class="details">

                    <div>
                        <dt>FORMATO</dt>
                        <dd id="livro-formato"></dd>
                    </div>

                    <div>
                        <dt>IDIOMA</dt>
                        <dd id="livro-idioma"></dd>
                    </div>

                    <div>
                        <dt>EDIÇÃO</dt>
                        <dd id="livro-edicao"></dd>
                    </div>

                </dl>

                <div class="purchase">

                    <div class="price">

                        <span>
                            POR APENAS
                        </span>

                        <strong id="livro-preco"></strong>

                    </div>

                    <button type="button" id="adicionar-carrinho">
                        Adicionar ao carrinho
                    </button>

                </div>

                <p class="mensagem-sucesso" id="carrinho-status" role="status"></p>

            </div>

        </section>


        <section class="not-found" id="nao-encontrado" hidden>

            <h1>Livro não encontrado.</h1>

            <p>
                Esse livro não existe ou foi removido.
            </p>

            <a href="../home/home.html#catalogo">Voltar ao catálogo</a>

        </section>

    </main>


    <footer class="footer">

        <img
            src="../img/logoauristicatrue.png"
            alt="Auristica Livraria"
        >

        <p>
            &copy; 2026 Livraria. Todos os direitos reservados.
        </p>

    </footer>


    <script src="../js/storage.js"></script>
    <script src="../js/livro.js"></script>
    <script src="../js/acessibilidade.js"></script>

</body>

</html>
